[project]
name = "exam-grader"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2.0",
    "httpx",
    "requests",
    "python-multipart",
    "opencv-python-headless",
    "pytesseract",
    "pillow",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
